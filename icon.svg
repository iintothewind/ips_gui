<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="frameGray" x1="9" y1="14" x2="43" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8DDE4"></stop>
      <stop offset="1" stop-color="#A7AFBB"></stop>
    </linearGradient>

    <linearGradient id="skyGray" x1="14" y1="18" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F9FB"></stop>
      <stop offset="1" stop-color="#E4E8EE"></stop>
    </linearGradient>

    <linearGradient id="mountainBackGray" x1="22" y1="31" x2="36" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CDD3DB"></stop>
      <stop offset="1" stop-color="#AEB6C1"></stop>
    </linearGradient>

    <linearGradient id="mountainFrontGray" x1="14" y1="34" x2="32" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BEC5CF"></stop>
      <stop offset="1" stop-color="#919BA8"></stop>
    </linearGradient>

    <radialGradient id="sunGray" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(19 22) rotate(90) scale(5)">
      <stop offset="0" stop-color="#FAFBFC"></stop>
      <stop offset="1" stop-color="#D6DBE2"></stop>
    </radialGradient>

    <linearGradient id="starGold" x1="47" y1="5" x2="61" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8DA"></stop>
      <stop offset="0.45" stop-color="#FFD84D"></stop>
      <stop offset="1" stop-color="#E0A100"></stop>
    </linearGradient>
  </defs>

  <!-- muted photo card -->
  <rect x="7" y="14" width="38" height="38" rx="9" fill="white"></rect>
  <rect x="9" y="16" width="34" height="34" rx="7" fill="url(#skyGray)"></rect>
  <rect x="9" y="16" width="34" height="34" rx="7" stroke="url(#frameGray)" stroke-width="3.8" fill="none"></rect>

  <!-- weak grayscale image content -->
