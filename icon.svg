  <path d="M23.5 31.2L29.2 38.8L35.4 29.3L41.2 41.5H23.5V31.2Z" fill="url(#mountainBackGray)"></path>
  <path d="M14.2 41.8L22.8 31.3L29 39L31.8 35.5L36.8 41.8H14.2Z" fill="url(#mountainFrontGray)"></path>

